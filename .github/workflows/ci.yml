name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: make verify-core

  verify-scalable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.15"
      - run: uv sync --frozen --extra scalable
      - run: make verify-scalable
