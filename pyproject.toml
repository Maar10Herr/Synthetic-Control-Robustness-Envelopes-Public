[project]
name = "synthetic-control-robustness-envelopes"
version = "0.4.3"
description = "Certified optimization-robustness envelopes for classical synthetic control"
requires-python = ">=3.12"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Maarten Linus Herrmann"}]
dependencies = []

[project.optional-dependencies]
scalable = ["numpy==2.5.2", "scipy==1.18.1"]

[project.urls]
Homepage = "https://github.com/Maar10Herr/Synthetic-Control-Robustness-Envelopes-Public"
Paper = "https://github.com/Maar10Herr/Synthetic-Control-Robustness-Envelopes-Public/blob/main/paper/Herrmann_Sharp_SCM_Robustness_Envelopes.pdf"
Issues = "https://github.com/Maar10Herr/Synthetic-Control-Robustness-Envelopes-Public/issues"

[tool.uv]
package = false
